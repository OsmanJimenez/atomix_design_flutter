name: Deploy Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd packages/atomix_design_flutter && flutter pub get
          cd ../../apps/atomix_docs && flutter pub get

      - name: Generate Widgetbook Code
        run: |
          cd apps/atomix_docs
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Web Documentation
        run: |
          cd apps/atomix_docs
          flutter build web --base-href "/atomix_design_flutter/" --release

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/atomix_docs/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
